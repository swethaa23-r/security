<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Admin Dashboard | Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css?v=3">
    
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg-dark: #050816;
            --bg-panel: rgba(20, 29, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #fff;
            --text-muted: #a0aabf;
            --primary: #00E5FF;
            --secondary: #6C63FF;
            --accent: #14F195;
            --danger: #ff4757;
            --warning: #ffa502;
            --sidebar-width: 260px;
            --header-height: 80px;
        }

        body.dashboard-body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden; /* Main body shouldn't scroll, content area will */
        }

        /* --- Animations --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 229, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
        }
        @keyframes mapPing {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(11, 17, 32, 0.95);
            border-right: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }
        .sidebar-logo .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--primary);
            border-radius: 6px;
            box-shadow: 0 0 10px var(--primary);
        }
        .sidebar-logo span {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s;
            gap: 15px;
            border-left: 3px solid transparent;
        }

        .nav-item i {
            width: 20px;
            height: 20px;
            transition: 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--primary);
            background: rgba(0, 229, 255, 0.05);
            border-left-color: var(--primary);
        }
        .nav-item:hover i, .nav-item.active i {
            stroke: var(--primary);
        }

        .sidebar-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
        }
        
        /* Mobile Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            backdrop-filter: blur(2px);
        }

        /* --- Main Content --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Top Navbar --- */
        .top-navbar {
            height: var(--header-height);
            background: rgba(11, 17, 32, 0.8);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 50;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }
        .mobile-toggle i { width: 24px; height: 24px; }

        .search-bar {
            position: relative;
            width: 300px;
        }
        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }
        .search-bar input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 10px 10px 10px 45px;
            border-radius: 20px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            background: rgba(0, 229, 255, 0.05);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { color: #fff; }
        .icon-btn i { width: 22px; height: 22px; }
        
        .notification-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulseGlow 2s infinite;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding-left: 15px;
            border-left: 1px solid var(--border-color);
        }
        .admin-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .admin-info {
            display: flex;
            flex-direction: column;
        }
        .admin-name { font-weight: 600; font-size: 0.9rem; }
        .admin-role { font-size: 0.75rem; color: var(--primary); }

        /* --- Dashboard Content Area --- */
        .content-area {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: 600;
        }
        .date-filter {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* --- Widgets Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }
        .stat-card:nth-child(5) { animation-delay: 0.5s; }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.2);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stat-trend {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .trend-up { color: var(--success); }
        .trend-down { color: var(--danger); }
        .trend-neutral { color: var(--warning); }

        /* Icon Colors */
        .stat-card:nth-child(1) .stat-icon { color: var(--primary); }
        .stat-card:nth-child(2) .stat-icon { color: var(--danger); }
        .stat-card:nth-child(3) .stat-icon { color: var(--accent); }
        .stat-card:nth-child(4) .stat-icon { color: var(--warning); }
        .stat-card:nth-child(5) .stat-icon { color: var(--secondary); }

        /* --- Dashboard Main Grid --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
            animation-delay: 0.6s;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .panel-actions {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Chart Containers */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .chart-container-sm {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* --- Live Attack Feed & Tables --- */
        .feed-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .feed-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .feed-item:last-child { border-bottom: none; }
        
        .feed-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
        }
        .feed-icon.high { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .feed-icon.medium { background: var(--warning); }
        .feed-icon.low { background: var(--primary); }
        
        .feed-content { flex: 1; }
        .feed-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 3px; }
        .feed-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 12px 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        .data-table td {
            padding: 15px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .data-table tr:last-child td { border-bottom: none; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge.bg-danger { background: rgba(255, 71, 87, 0.15); color: var(--danger); }
        .badge.bg-warning { background: rgba(255, 165, 2, 0.15); color: var(--warning); }
        .badge.bg-success { background: rgba(46, 213, 115, 0.15); color: var(--success); }

        /* --- AI Prediction Panel --- */
        .ai-panel {
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.1), rgba(0, 229, 255, 0.05));
            border: 1px solid rgba(108, 99, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .ai-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
        }
        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--secondary);
            font-weight: 600;
        }
        .ai-header i { width: 20px; height: 20px; }
        .ai-text { font-size: 0.9rem; line-height: 1.5; color: #e2e8f0; }

        /* --- Quick Actions --- */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }
        .action-btn i { width: 20px; height: 20px; }

        /* --- World Map Panel --- */
        .map-container {
            position: relative;
            width: 100%;
            height: 250px;
            background-size: cover;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }
        /* Custom basic map for prototype */
        .map-bg {
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .map-ping {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--danger);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .map-ping::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid var(--danger);
            animation: mapPing 2s infinite ease-out;
        }

        /* --- Responsive Design --- */
        @media (max-width: 1400px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                bottom: 0;
            }
            .sidebar.active {
                transform: translateX(260px);
            }
            .sidebar-overlay.active {
                display: block;
            }
            .mobile-toggle { display: block; }
            .search-bar { display: none; } /* Hide search on mobile header for space */
            .stats-grid { grid-template-columns: 1fr; }
            .content-area { padding: 20px; }
            .top-navbar { padding: 0 20px; }
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        @media (max-width: 768px) {
            .mobile-toggle { display: block !important; }
            .mobile-top-logo { display: block !important; }
        }
    </style>


    <style>
        * { box-sizing: border-box; }
        .dashboard-grid-3 { grid-template-columns: 1fr 2fr 1fr; }
        @media (max-width: 1024px) {
            .dashboard-grid-3 { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 768px) {
            .admin-info { display: none !important; }
        }
    </style>

<style>
        /* Extra mobile tweaks to prevent content hiding */
        th, td { white-space: nowrap; }
        .ai-text, .action-btn { overflow-wrap: break-word; word-break: break-word; }
        img, canvas { max-width: 100%; height: auto; }
        @media (max-width: 480px) {
            .quick-actions { grid-template-columns: 1fr !important; }
            .content-area { padding: 15px !important; }
            .panel { padding: 15px !important; }
            .search-bar { width: 100% !important; max-width: 100%; }
        }
</style>
<style>
        /* Global Anti-Overlap & Image Constraints */
        p, h1, h2, h3, h4, h5, h6, span, a, li, div {
            overflow-wrap: break-word;
        }
        th, td { 
            white-space: nowrap; 
        }
        img, video, canvas, iframe { 
            max-width: 100% !important; 
            height: auto !important; 
            object-fit: contain;
        }
        /* Fix generic flex/grid overlaps on mobile */
        @media (max-width: 768px) {
            .flex-container, .row, .dashboard-grid {
                flex-wrap: wrap !important;
            }
        }
</style>

    


    <style>
    /* Ultimate Mobile Layout Fix v2 */
    @media (max-width: 768px) {
        /* Force ALL dashboard data grids into a single vertical stack */
        .top-metrics-grid, 
        .main-grid, 
        .dashboard-grid, 
        .dashboard-grid-3,
        .quick-actions, 
        .quick-actions-grid,
        .content-grid,
        .analytics-grid,
        .metrics-grid,
        .stats-grid,
        .incident-grid,
        .threat-grid,
        .heatmap-grid {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
        }

        /* Hide non-essential header texts to save space on tiny screens */
        .admin-profile span,
        .admin-info,
        .status-badge,
        .header-title-text {
            display: none !important;
        }

        /* Ensure navbars remain in one row but have space */
        .top-navbar, .nav-left, .nav-right {
            justify-content: space-between !important;
            flex-wrap: nowrap !important;
        }
        
        .nav-left {
            gap: 10px !important;
        }

        /* Adjust content area padding to prevent overflow */
        .content-area {
            padding: 15px !important;
        }
        
        /* Any table container */
        .table-responsive, [style*="overflow-x: auto"] {
            max-width: 100% !important;
        }
    }
    </style>

        <!-- Dashboard Content -->
        <main class="content-area">

            </div>
