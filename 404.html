<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        * { box-sizing: border-box; }
        .error-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--bg-color);
        }
        .error-content h1 {
            font-size: 6rem;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        .dashboard-grid-3 { grid-template-columns: 1fr 2fr 1fr; }
        @media (max-width: 1024px) {
            .dashboard-grid-3 { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 768px) {
            .admin-info { display: none !important; }
        }
    </style>

<style>
        /* Extra mobile tweaks to prevent content hiding */
        th, td { white-space: nowrap; }
        .ai-text, .action-btn { overflow-wrap: break-word; word-break: break-word; }
        img, canvas { max-width: 100%; height: auto; }
        @media (max-width: 480px) {
            .quick-actions { grid-template-columns: 1fr !important; }
            .content-area { padding: 15px !important; }
            .panel { padding: 15px !important; }
            .search-bar { width: 100% !important; max-width: 100%; }
        }
</style>
<style>
        /* Global Anti-Overlap & Image Constraints */
        p, h1, h2, h3, h4, h5, h6, span, a, li, div {
            overflow-wrap: break-word;
        }
        th, td { 
            white-space: nowrap; 
        }
        img, video, canvas, iframe { 
            max-width: 100% !important; 
            height: auto !important; 
            object-fit: contain;
        }
        /* Fix generic flex/grid overlaps on mobile */
        @media (max-width: 768px) {
            .flex-container, .row, .dashboard-grid {
                flex-wrap: wrap !important;
            }
        }
</style>

    


    <style>
    /* Ultimate Mobile Layout Fix v2 */
    @media (max-width: 768px) {
        /* Force ALL dashboard data grids into a single vertical stack */
        .top-metrics-grid, 
        .main-grid, 
        .dashboard-grid, 
        .dashboard-grid-3,
        .quick-actions, 
        .quick-actions-grid,
        .content-grid,
        .analytics-grid,
        .metrics-grid,
        .stats-grid,
        .incident-grid,
        .threat-grid,
        .heatmap-grid {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
        }

        /* Hide non-essential header texts to save space on tiny screens */
        .admin-profile span,
        .admin-info,
        .status-badge,
        .header-title-text {
            display: none !important;
        }

        /* Ensure navbars remain in one row but have space */
        .top-navbar, .nav-left, .nav-right {
            justify-content: space-between !important;
            flex-wrap: nowrap !important;
        }
        
        .nav-left {
            gap: 10px !important;
        }

        /* Adjust content area padding to prevent overflow */
        .content-area {
            padding: 15px !important;
        }
        
        /* Any table container */
        .table-responsive, [style*="overflow-x: auto"] {
            max-width: 100% !important;
        }
    }
    </style>

    <link rel="stylesheet" href="updates.css?v=2">
</head>
<body>



    <section class="error-section">
        <div class="error-content fade-in-up">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p style="margin-bottom: 30px;">The page or social profile you are looking for doesn't exist or has been moved.</p>
            <div style="display: flex; gap: 15px; justify-content: center; align-items: center;">
                <button onclick="if(window.history.length > 1) { history.back(); } else { window.location.href = 'index.html'; }" class="btn btn-outline" style="cursor: pointer;">Go Back</button>
                <a href="index.html" onclick="document.getElementById('nav-drawer').classList.remove('active'); document.getElementById('nav-overlay').classList.remove('active'); document.body.classList.remove('no-scroll');" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </section>
    
    
    <!-- Lenis, GSAP, ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <script>
        // Universal Mobile Toggle (Safe)
        (function() {
            var btn = document.getElementById('mobileToggle');
            var side = document.getElementById('sidebar');
            var over = document.getElementById('sidebarOverlay');
            if(btn && side && over) {
                btn.onclick = function() {
                    side.classList.toggle('active');
                    over.classList.toggle('active');
                };
                over.onclick = function() {
                    side.classList.remove('active');
                    over.classList.remove('active');
                };
            }
        })();
    </script>
</body>
</html>
