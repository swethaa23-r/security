<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    




    


    






<style>
/* =========================================================
   MODERN SPLIT-SCREEN AUTHENTICATION (ENTERPRISE SAAS)
   ========================================================= */

body.auth-split-page {
    margin: 0; padding: 0;
    min-height: 100dvh;
    display: flex;
    background-color: #0b1120 !important;
    font-family: 'Outfit', sans-serif;
    color: #fff;
    overflow-x: hidden;
}

/* --- Left Side (Form) --- */
.split-left {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #0b1120;
    position: relative;
    z-index: 10;
}

.auth-container {
    width: 100% !important;
    max-width: 440px !important;
    margin: 0 auto;
    position: relative;
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 30px;
    transition: color 0.3s;
    animation: fadeIn 0.6s ease forwards;
}
.back-link:hover { color: #fff; }

.auth-card {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
}

.auth-header {
    text-align: left !important;
    margin-bottom: 30px !important;
}
.auth-header h1 {
    font-size: 2rem !important;
    font-weight: 600 !important;
    margin-bottom: 8px !important;
    animation: textReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
    opacity: 0;
    transform: translateY(15px);
}
.auth-header p {
    font-size: 0.95rem !important;
    color: #94a3b8 !important;
    margin: 0 !important;
    animation: textReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    opacity: 0;
    transform: translateY(15px);
}

/* Staggered form animations */
.form-group, .form-options, .btn-submit, .auth-footer {
    animation: textReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(15px);
}
.form-group:nth-child(1) { animation-delay: 0.3s; }
.form-group:nth-child(2) { animation-delay: 0.4s; }
.form-group:nth-child(3) { animation-delay: 0.5s; }
.form-options { animation-delay: 0.6s; }
.btn-submit { animation-delay: 0.7s; }
.auth-footer { animation-delay: 0.8s; }

@keyframes textReveal {
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Crisp Professional Inputs */
.form-group {
    margin-bottom: 20px !important;
    text-align: left !important;
    position: relative;
    display: block !important;
    flex-direction: unset !important;
}
.form-group label {
    font-size: 0.9rem !important;
    font-weight: 500 !important;
    color: #cbd5e1 !important;
    margin-bottom: 8px !important;
    display: block !important;
    position: static !important;
    background: transparent !important;
    top: auto !important;
    left: auto !important;
}
.form-group input, .form-group select {
    padding: 16px 18px !important;
    height: auto !important;
    line-height: normal !important;
    border-radius: 10px !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    background: rgba(5, 8, 22, 0.8) !important;
    color: #fff !important;
    font-size: 1.05rem !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    width: 100% !important;
    box-sizing: border-box;
    cursor: pointer;
}
.form-group select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
    background-repeat: no-repeat !important;
    background-position: right 16px center !important;
    background-size: 16px !important;
}
.form-group input:hover, .form-group select:hover {
    border-color: rgba(0, 229, 255, 0.5) !important;
    background: rgba(0, 0, 0, 0.6) !important;
}
.form-group input:focus, .form-group select:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.2) !important;
    background: #000 !important;
    outline: none;
}
.form-group select option {
    background: #0b1120;
    color: #fff;
    padding: 10px;
}
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear,
input[type="password"]::-webkit-credentials-auto-fill-button {
    display: none !important;
}

/* Checkbox fixes */
.remember-me {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #94a3b8;
}
.remember-me input[type="checkbox"] {
    accent-color: var(--primary);
    width: 16px !important;
    height: 16px !important;
    cursor: pointer;
    margin: 0;
}
.forgot-password {
    color: var(--primary);
    text-decoration: none;
    font-size: 0.9rem;
}
.forgot-password:hover { text-decoration: underline; }

/* Options */
.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px !important;
    font-size: 0.9rem !important;
}

/* Primary Button */
.btn-submit {
    height: 56px !important;
    border-radius: 10px !important;
    font-size: 1.1rem !important;
    font-weight: 600 !important;
    background: var(--primary) !important;
    color: #000 !important;
    border: none !important;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    width: 100% !important;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 229, 255, 0.2) !important;
}
.btn-submit:hover {
    background: #00c4e0 !important;
    transform: translateY(-3px) !important;
    box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4) !important;
}
.auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.9rem;
    color: #94a3b8;
}
.auth-footer a {
    color: #fff;
    text-decoration: none;
    margin-left: 4px;
}
.auth-footer a:hover { color: var(--primary); }

/* --- Right Side (Graphic / Branding) --- */
.split-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: linear-gradient(135deg, #050816 0%, #0a1930 100%);
    overflow: hidden;
    padding: 40px;
}

/* Animated Particles / Grid */
.split-right::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
    animation: rotateGlow 30s linear infinite;
    z-index: 1;
}
.split-right::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 2;
    animation: panGrid 20s linear infinite;
}

@keyframes rotateGlow { 100% { transform: rotate(360deg); } }
@keyframes panGrid { 100% { background-position: 60px 60px; } }

.split-right-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 400px;
    animation: fadeInRight 1s ease forwards;
}

.split-right-content h2 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 15px;
    background: linear-gradient(to right, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.split-right-content p {
    font-size: 1.1rem;
    color: #94a3b8;
    line-height: 1.6;
}

@keyframes fadeInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* --- Responsive Breakpoints --- */
@media (max-width: 1024px) {
    .split-right { display: none !important; }
    .split-left { background: #050816 !important; }
}

@media (max-width: 767px) {
    .auth-header h1 { font-size: 1.8rem !important; }
    .form-options { flex-direction: column; align-items: flex-start; gap: 10px; }
    .auth-container { padding: 0 15px !important; }
}
</style>
    <link rel="stylesheet" href="updates.css">
</head>
<body class="auth-split-page">



    <div class="split-left"><div class="auth-container">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-link"></i>
            Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="lo.webp" alt="Logo" class="nav-logo-img">
                </a>
                <h1>Welcome back</h1>
                <p>Enter your details to access your dashboard.</p>
            </div>

                                    <form action="dashboard.html" method="GET">
                <div class="form-group" id="role-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="client">Client</option>
                        <option value="admin">Admin</option>
                        <option value="analyst">Analyst</option>
                    </select>
                    <span id="role-error" style="color: #ff4757; font-size: 0.85rem; display: none; margin-top: 8px;">Please select a role to continue.</span>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="name@company.com" >
                </div>
                <div class="form-group password-group" style="position: relative;">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="��������" >
                    <i class="fa-solid fa-eye toggle-password" style="position: absolute; right: 16px; top: 42px; cursor: pointer; color: #cbd5e1;"></i>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="404.html" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>


    <!-- Lenis, GSAP, ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <script>
        // Universal Mobile Toggle (Safe)
        (function() {
            var btn = document.getElementById('mobileToggle');
            var side = document.getElementById('sidebar');
            var over = document.getElementById('sidebarOverlay');
            if(btn && side && over) {
                btn.onclick = function() {
                    side.classList.toggle('active');
                    over.classList.toggle('active');
                };
                over.onclick = function() {
                    side.classList.remove('active');
                    over.classList.remove('active');
                };
            }
        })();
    </script>
</div><div class="split-right"><div class="split-right-content"><h2>Secure Your Enterprise</h2><p>Advanced threat detection, zero-day protection, and real-time response.</p></div></div><script>
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var role = document.getElementById('role');
    var roleError = document.getElementById('role-error');
    
    if (!role || !role.value) {
        if (roleError) roleError.style.display = 'block';
        return;
    }
    
    if (roleError) roleError.style.display = 'none';

    if (role.value === 'client') {
        window.location.href = 'client-dashboard.html';
    } else if (role.value === 'admin') {
        window.location.href = 'admin-dashboard.html';
    } else if (role.value === 'analyst') {
        window.location.href = 'analyst-dashboard.html';
    }
});

const togglePassword = document.querySelector('.toggle-password');
const passwordInput = document.getElementById('password');
if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });
}
</script>
</body>
</html>
